<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InstiLite — Insti happenings all at once (demo prototype)</title>
<meta name="description" content="InstiLite prototype: one calendar for IIT Madras events, PORs and placement schedules. All data is fictional demo data.">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="phone" id="phone" aria-label="InstiLite phone prototype">
    <div class="statusbar" id="statusbar"></div>
    <main class="screen" id="screen" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<noscript>InstiLite prototype needs JavaScript.</noscript>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens-student.js"></script>
<script src="js/screens-student2.js"></script>
<script src="js/screens-manage.js"></script>
<script src="js/main.js"></script>
</body>
</html>
